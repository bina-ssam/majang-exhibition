<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>마장초등학교 AI 디지털 활용 연구학교 전시관</title>
<!-- 글꼴: 엘리스 디지털 배움체 (이 글꼴에 없는 글자는 프리텐다드로 대신 나옵니다) -->
<link rel="preconnect" href="https://cdn-front-door.elice.io" crossorigin>
<link rel="stylesheet" href="https://font.elice.io/css?family=Elice+Digital+Baeum">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<!--
  마장초 온라인 전시관 — 가로로 펼쳐지는 카드
  학교에 설치한 스탠바이미 화면에서 보여 주기 위해 만들었습니다. 가로·세로 모두 됩니다.

  · 바탕은 보라에서 파랑으로 번지는 어두운 그라데이션입니다.
    큰 제목 글자는 성과공유회 자료집 표지처럼 하늘색 → 라벤더 → 분홍 그라데이션입니다.
    사진 파일을 쓰지 않고 색으로 그려서, 가로로 눕히든 세로로 세우든 흐려지지 않습니다.
  · 카드는 전시관마다 다른 진한 색으로 꽉 채웠습니다(분홍·파랑·주황·초록). 글자는 카드 안팎 모두 흰색입니다.
  · 카드 한 장이 옆으로 넓어지면서 오른쪽에 아주 연한 색 그림칸이 열립니다.
    손대지 않으면 4.5초마다 저절로 옆 카드로 넘어갑니다.
  · 카드를 한 번 누르면 바로 그 전시관으로 들어갑니다. (손가락이 닿는 순간 그 카드가 펼쳐져 눌린 것이 보입니다.)
  · 세로로 세운 스탠바이미에서는 카드가 위아래로 쌓입니다.
  · 전시관은 네 곳입니다: 연구학교 소개관 · Hi AI와 성장하는 학생 High 5 · Hi AI와 성장하는 교사 High 5 · 연구학교 영상관
  · 연구학교 소개관·교사 전시관에 들어가면 볼거리를 고르는 화면이 먼저 나옵니다.
    하나를 연 뒤에도 위쪽 단추로 다른 볼거리로 바로 넘어갈 수 있습니다.
    - 소개관: Hi AI 소개 · 연구학교 최종 보고서(전자책) · 연구학교 홈페이지
    - 교사 전시관: 단원 설계 사이트(활용 영상 + 사이트 단추) · 교사 Vibe ON 수업 자료 · AI 에듀테크 교사 동아리 자료집
  · 학생 전시관은 고르는 화면 없이 학생 High 5 설명 아래에 학년별 수업 사진·영상이 바로 나옵니다.
  · 전자책은 보고서 PDF 를 쪽마다 그림으로 바꿔 files/report/ 에 넣어 두었습니다 (앞·뒤표지 포함 01.jpg ~ 58.jpg).
  · 이전 디자인은 보관 폴더에 두었습니다. (사각형 카드: index_20261015_이전본_사각형카드.html,
    패들렛 하나만 있던 판: index_20261019_이전본_패들렛1개.html,
    교사 역량 강화관 패들렛 고르기 판: index_20261020_이전본_패들렛고르기.html)
    다른 시안들은 시안 폴더에 있습니다.
-->
<style>
  :root {
    /* 바탕과 글자색 */
    --paper: #0d1033;               /* 그라데이션이 안 깔릴 때 쓰이는 기본 바탕색 */
    --ink:   #ffffff;                 /* 어두운 바탕 위 글자색 (제목·안내 글) */
    --ink-2: rgba(255,255,255,.74);
    --ink-3: rgba(255,255,255,.5);
    --line:  rgba(255,255,255,.18);
    --on-accent: #0d1033;             /* 밝은 포인트 색 위에 올라가는 글자색 */

    --card-ink:   #ffffff;            /* 진한 카드 안 글자색 */
    --card-ink-2: rgba(255,255,255,.88);

    /* 뒷배경 그라데이션 — 보내 주신 사진에서 뽑은 색입니다.
       각 줄이 '크기 at 위치, 색' 한 덩어리이고, 위에 적힌 것이 위에 겹칩니다. */
    --mesh:
      radial-gradient(72% 72% at  10%  -8%, #442d94 0%, rgba(68,45,148,0)  72%),   /* 보라 */
      radial-gradient(68% 72% at  94%  -4%, #2b3da6 0%, rgba(43,61,166,0)  74%),   /* 남보라 */
      radial-gradient(62% 72% at  -8%  68%, #183a8c 0%, rgba(24,58,140,0)  72%),   /* 파랑 */
      radial-gradient(72% 80% at  88%  74%, #51309b 0%, rgba(81,48,155,0)  74%),   /* 보라 */
      radial-gradient(64% 62% at  48% 116%, #142470 0%, rgba(20,36,112,0)  72%);   /* 짙은 파랑 */

    /* 표지 제목 글자 그라데이션 — 하늘색 → 라벤더 → 분홍 */
    --sky:   #82c0ea;
    --lilac: #c8b4dc;
    --pink:  #f2a5c9;
    --grad:  linear-gradient(90deg, var(--sky), var(--lilac) 50%, var(--pink));

    /* 카드 바탕(반투명 흰색) 과 포인트 색 */
    --card-1: #3f4fb8;                /* 카드 기본색 — 전시관마다 아래 설정의 tint 로 덮어씁니다 */
    --card-2: #5e6fd4;
    --accent: #c8b4dc;

    --display: "Elice Digital Baeum", "Pretendard", sans-serif;
    --g1: #7f8fe8; --g2: #a8b8f7;      /* 전시관 대표색 — 화살표 단추·화면 전환에 쓰입니다 */
    --s1: #eef1ff; --s2: #f8f9ff;      /* 펼쳤을 때 열리는 그림칸 색 (연한 쪽) */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(15px, calc(0.72vmin + 0.52vmax), 26px); }
  html, body { height: 100%; }
  body {
    font-family: "Elice Digital Baeum", "Pretendard", system-ui, sans-serif;
    background-color: var(--paper); background-image: var(--mesh);
    background-attachment: fixed; background-repeat: no-repeat; color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overflow: hidden; word-break: keep-all;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; text-align: left; }
  svg { display: block; }

  /* ---------- 바탕 위에 얹는 옅은 빛무리 ---------- */
  .bg { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg { display: none; }

  #app { position: relative; z-index: 1; height: 100%; }
  .rise { animation: rise .8s cubic-bezier(.2,.75,.2,1) both; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } }
  .press { transition: transform .25s cubic-bezier(.2,.75,.2,1); }
  .press:active { transform: scale(.96); }

  /* ---------- 첫 화면 ---------- */
  .page { height: 100%; display: flex; flex-direction: column; gap: 2.2rem; padding: 3.2rem 3.4rem 2.6rem; }

  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; flex-shrink: 0; }
  .eyebrow { font-size: .92rem; font-weight: 700; letter-spacing: .02em; color: var(--ink-2); }
  .eyebrow span { font-family: var(--display); letter-spacing: .16em; color: var(--accent); }
  h1 { margin-top: .85rem; font-size: 4.1rem; font-weight: 700; line-height: 1.08; letter-spacing: -.035em; }
  h1 small { display: block; font-size: .6em; line-height: 1.1; letter-spacing: -.03em; color: var(--ink-2); }
  h1 em { font-style: normal; color: var(--accent); }
  /* 큰 제목은 표지처럼 하늘색 → 라벤더 → 분홍 그라데이션 글자 (지원하지 않는 화면에서는 라벤더 한 색) */
  h1 .grad { display: inline; color: var(--lilac); background-image: var(--grad);
             -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  /* 제목 아래 연구 주제 — Hi AI 는 하늘색, High 5 는 분홍색 (표지 글자색) */
  .theme { margin-top: 1.1rem; display: flex; align-items: center; flex-wrap: wrap; gap: .5rem .9rem;
           font-size: 2.15rem; font-weight: 700; letter-spacing: -.02em; color: rgba(255,255,255,.92); }
  .theme .label { padding: .3rem .85rem; border-radius: 999px; font-size: .5em; font-weight: 700; letter-spacing: .06em;
                  color: #fff; background: rgba(200,180,220,.16); border: 1px solid rgba(200,180,220,.55); }
  .theme b { font-family: var(--display); font-weight: 700; }
  .theme .ai { color: var(--sky); }
  .theme .h5 { color: var(--pink); }
  .theme .br { color: var(--lilac); }

  /* 오른쪽 위 '연구학교 홈페이지' 버튼 */
  .site {
    display: inline-flex; align-items: center; gap: .6rem; flex-shrink: 0;
    text-decoration: none; color: inherit;
    padding: .32rem .32rem .32rem 1.05rem; border-radius: 999px;
    background: rgba(255,255,255,.1); border: 2px solid var(--accent);
    box-shadow: 0 10px 28px -16px rgba(157,176,255,.6);
    transition: background .3s, color .3s;
  }
  .site .house { width: 1.3rem; height: 1.3rem; color: var(--accent); transition: color .3s; }
  .site .ko { font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
  .site .ring { width: 2.5rem; height: 2.5rem; border-radius: 50%; flex-shrink: 0;
                background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
                transition: background .3s, color .3s; }
  .site .ring svg { width: 1.05rem; height: 1.05rem; }
  .site:active { background: var(--accent); color: var(--on-accent); }
  .site:active .house { color: var(--on-accent); }
  .site:active .ring { background: var(--paper); color: var(--accent); }

  /* ---------- 카드 줄 ---------- */
  .halls { flex: 1; min-height: 0; display: flex; align-items: center; gap: 1.5rem; }
  .hall {
    position: relative; flex: 1 1 0; min-width: 0; overflow: hidden;
    height: 100%; max-height: 31rem;
    border-radius: 30px; display: flex; isolation: isolate;
    background: linear-gradient(135deg, var(--card-1), var(--card-2));
    border: 1px solid rgba(255,255,255,.2); color: var(--card-ink);
    transition: flex-grow .7s cubic-bezier(.3,.8,.25,1), box-shadow .5s ease, transform .25s cubic-bezier(.2,.75,.2,1);
  }
  .hall.on { flex-grow: 2.15; box-shadow: 0 28px 56px -22px rgba(0,0,0,.65); }
  .hall:active { transform: scale(.985); }
  /* 카드 안쪽 옅은 동그라미 장식 */
  .hall::before, .hall::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; background: rgba(255,255,255,.17); }
  .hall::before { width: 11rem; height: 11rem; left: .5rem; bottom: -3.4rem; }
  .hall::after  { width: 7rem;  height: 7rem;  left: 6.2rem; bottom: .4rem; background: rgba(255,255,255,.12); }

  .hall .body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; padding: 2.2rem 2.2rem 2rem; }
  .hall h2 { font-size: 2.15rem; font-weight: 700; line-height: 1.22; letter-spacing: -.025em; }
  .hall p {
    margin-top: 1rem; font-size: 1.02rem; line-height: 1.55; color: var(--card-ink-2); max-width: 22em;
    opacity: .18; transition: opacity .55s ease;
  }
  .hall.on p { opacity: 1; }

  .hall .go { margin-top: auto; padding-top: 1.4rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .hall .go span { font-size: 1.02rem; font-weight: 700; }
  .hall .dot {
    width: 3.2rem; height: 3.2rem; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    border: 1px solid rgba(255,255,255,.45); color: var(--card-ink);
    transition: background .45s ease, color .45s ease, border-color .45s ease, transform .45s ease;
  }
  .hall .dot svg { width: 1.25rem; height: 1.25rem; }
  .hall.on .dot { background: #fff; border-color: #fff; color: var(--g1); transform: rotate(45deg); }
  .hall.on .dot svg { transform: rotate(-45deg); }

  /* 펼쳐질 때 열리는 그림칸 (사진을 넣으면 사진이 들어갑니다)
     스탠바이미(LG webOS 브라우저)에서도 보이도록 너비(width)만 늘렸다 줄이는 단순한 방식으로 만들었습니다. */
  .hall .shot { flex: none; width: 0; overflow: hidden; display: flex; justify-content: flex-end;
                transition: width .7s cubic-bezier(.3,.8,.25,1); }
  .hall.on .shot { width: 14.5rem; }
  .hall .shot .in {
    position: relative; flex: none; width: 13.2rem; margin: 1.3rem 1.3rem 1.3rem 0;
    border-radius: 22px; overflow: hidden;
    background-color: #f4f6fb; background-color: var(--s1);
    background-image: linear-gradient(150deg, var(--s1), var(--s2));
    border: 1px solid rgba(255,255,255,.75);
    display: flex; align-items: center; justify-content: center;
  }
  .hall .shot .in img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .hall .shot .in svg { width: 5.2rem; height: 5.2rem; color: var(--g1); stroke-width: 1.5; }

  .hint { flex-shrink: 0; display: flex; align-items: center; gap: .7rem; font-size: 1rem; color: var(--ink-3); }
  .hint svg { width: 1.4rem; height: 1.4rem; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(7px); } }

  /* 누른 카드가 둥글게 번지며 화면을 덮는 전환 */
  .reveal { position: fixed; z-index: 20; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 34% 26%, var(--g2), var(--g1) 72%);
    transform: translate(-50%, -50%) scale(1); opacity: 1;
    transition: transform .6s cubic-bezier(.45,.05,.2,1), opacity .45s ease .05s; }

  /* ---------- 전시관 안쪽 ---------- */
  #inner { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; display: flex; flex-direction: column;
           background-color: var(--paper); background-image: var(--mesh);
           animation: innerIn .5s cubic-bezier(.2,.8,.25,1) both; }
  #inner[hidden] { display: none; }
  #inner.leaving { animation: innerOut .35s ease forwards; }
  @keyframes innerIn { from { opacity: 0; transform: scale(1.03); } }
  @keyframes innerOut { to { opacity: 0; transform: scale(1.02); } }

  .ibar { display: flex; align-items: center; gap: 1.2rem; padding: 1.1rem 1.8rem; flex-shrink: 0;
          background: rgba(255,255,255,.07); border-bottom: 1px solid var(--line); }
  .pill-btn { display: inline-flex; align-items: center; gap: .5rem; min-height: 3.6rem; padding: 0 1.5rem 0 1.1rem;
              border-radius: 999px; font-size: 1.1rem; font-weight: 700; background: #fff; color: var(--paper); }
  .pill-btn svg { width: 1.4rem; height: 1.4rem; }
  .ibar .mark { width: 1rem; height: 1rem; border-radius: 50%; background: var(--g1); flex-shrink: 0; }
  .ibar .t small { display: block; font-family: var(--display); font-size: .82rem; font-weight: 700; letter-spacing: .18em; color: var(--ink-3); }
  .ibar .t strong { display: block; font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }

  /* 바탕을 비워 두어야 '준비 중' 화면에서 뒤 그라데이션이 보입니다.
     사이트를 불러오는 경우에는 아래 iframe 이 흰 바탕을 깝니다. */
  .ibody { flex: 1; min-height: 0; display: flex; position: relative; background: transparent; }
  .loading { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
             background: var(--paper); font-size: 1.1rem; font-weight: 700; color: var(--ink-2); }
  .spin { width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--g1); animation: spinner 1s linear infinite; }
  @keyframes spinner { to { transform: rotate(360deg); } }
  .ibody iframe { flex: 1; width: 100%; height: 100%; border: 0; background: #fff; }
  .ibody.dark, .ibody.dark iframe { background: #000; }

  .soon { margin: auto; text-align: center; padding: 2rem; }
  .soon .glow { width: 8.5rem; height: 8.5rem; margin: 0 auto 1.8rem; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(150deg, var(--g1), var(--g2)); box-shadow: 0 24px 60px -24px var(--g1); animation: breathe 3s ease-in-out infinite; color: #fff; }
  .soon .glow svg { width: 3.8rem; height: 3.8rem; }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  .soon h2 { font-size: 2.2rem; font-weight: 700; letter-spacing: -.025em; }
  .soon p { margin-top: .7rem; font-size: 1.1rem; color: var(--ink-2); line-height: 1.6; }

  /* ---------- 전시관 안 '고르기' 화면 (교사 역량 강화관) ---------- */
  .pick { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1.5rem; padding: 2.6rem 3.4rem 2.8rem; overflow: auto; }
  .pick-head .lead { font-size: 1.15rem; line-height: 1.6; color: var(--ink-2); }
  .pick-head .lead b { color: #fff; }
  /* High 5 역량 설명 — 다섯 칸 */
  .high5 h3 { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; font-size: 1.85rem; font-weight: 700; letter-spacing: -.02em; }
  .high5 h3 small { font-size: 1.2rem; font-weight: 500; letter-spacing: 0; color: var(--ink-2); }
  .high5 ol { list-style: none; margin-top: 1rem; display: grid; grid-template-columns: repeat(5, 1fr); gap: .8rem; }
  .high5 li { padding: 1.2rem 1.3rem 1.3rem; border-radius: 18px; background: rgba(255,255,255,.08); border: 1px solid var(--line); }
  .high5 li b { display: flex; align-items: center; gap: .6rem; font-size: 1.35rem; font-weight: 700; }
  .high5 li b i { width: 1.8rem; height: 1.8rem; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
                  font-style: normal; font-size: .85rem; background: var(--g1); color: #fff; }
  .high5 + .boards .board h3 { font-size: 2.2rem; margin-top: .8rem; }
  .high5 + .boards .board { padding-top: 1.9rem; padding-bottom: 1.8rem; }
  .high5 li span { display: block; margin-top: .5rem; font-size: 1.15rem; line-height: 1.5; color: var(--ink-2); }
  .boards { flex: 0 0 auto; display: grid;   /* 화면을 채우지 않고 내용 높이만큼만 */ grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 1.6rem; }
  .board {
    position: relative; overflow: hidden; isolation: isolate; min-height: 0;
    display: flex; flex-direction: column; padding: 2.3rem 2.4rem 2.1rem; border-radius: 30px;
    background: linear-gradient(140deg, var(--b1), var(--b2)); color: #fff;
    border: 1px solid rgba(255,255,255,.22); box-shadow: 0 28px 56px -26px rgba(0,0,0,.7);
    transition: transform .25s cubic-bezier(.2,.75,.2,1);
  }
  .board:active { transform: scale(.98); }
  .board .tag { align-self: flex-start; display: inline-flex; align-items: center; gap: .45rem;
    padding: .4rem 1rem; border-radius: 999px; font-size: 1rem; font-weight: 700;
    background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); }
  .board .tag svg { width: 1rem; height: 1rem; }
  .board h3 { margin-top: 1.1rem; font-size: 2.55rem; font-weight: 700; line-height: 1.15; letter-spacing: -.03em; }
  .board h3 em { font-style: normal; font-family: var(--display); color: #fff3c4; }
  .board .what { margin-top: .9rem; font-size: 1.28rem; line-height: 1.6; color: rgba(255,255,255,.92); max-width: 26em; }
  .board .chips { margin-top: 1.2rem; display: flex; flex-wrap: wrap; gap: .5rem; }
  .board .chips span { padding: .45rem 1rem; border-radius: 999px; font-size: 1.08rem; font-weight: 700;
    background: #fff; color: var(--b1); }
  .board .go { margin-top: auto; padding-top: 1.6rem; display: flex; align-items: center; justify-content: space-between; }
  .board .go span:first-child { font-size: 1.25rem; font-weight: 700; }
  .board .go .dot { width: 3.6rem; height: 3.6rem; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--b1); }
  .board .go .dot svg { width: 1.4rem; height: 1.4rem; }
  /* 카드 오른쪽 위 장식 그림 */
  /* 카드 오른쪽 위 아이콘 하나 — 글자와 겹치지 않도록 글자 쪽은 오른쪽을 비워 둡니다 */
  .board .badge { position: absolute; top: 2.1rem; right: 2.1rem; width: 5.2rem; height: 5.2rem; border-radius: 50%;
                  display: grid; place-items: center; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.32); }
  .board .badge svg { width: 2.5rem; height: 2.5rem; color: #fff; }
  .board .tag, .board h3, .board .what, .board .chips, .board .by { margin-right: 6.4rem; }
  .board .by { margin-top: .9rem; display: flex; align-items: center; gap: .5rem; font-size: 1rem; font-weight: 700; }
  .board .by svg { width: 1.2rem; height: 1.2rem; }
  /* 볼거리가 두 개 이상인 카드 — 아래쪽에 흰 단추가 쌓입니다 */
  .board.multi:active { transform: none; }
  .board .links { margin-top: auto; padding-top: 1.5rem; display: grid; gap: .7rem; }
  .board .links button { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .75rem .8rem .75rem 1.3rem; border-radius: 18px; background: #fff; color: var(--b1);
    font-size: 1.12rem; font-weight: 700; transition: transform .25s cubic-bezier(.2,.75,.2,1); }
  .board .links button:active { transform: scale(.97); }
  .board .links .dot { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--b1); color: #fff; flex-shrink: 0; }
  .board .links .dot svg { width: 1.1rem; height: 1.1rem; }

  /* 패들렛을 연 뒤 위쪽에 나오는 '다른 패들렛' 전환 단추 */
  .seg { margin-left: auto; display: flex; gap: .3rem; padding: .3rem; border-radius: 999px;
         background: rgba(255,255,255,.1); border: 1px solid var(--line); }
  .seg[hidden] { display: none; }
  .seg button { min-height: 3rem; padding: 0 1.3rem; border-radius: 999px; font-size: 1rem; font-weight: 700; color: var(--ink-2);
                transition: background .3s, color .3s; }
  .seg button.on { background: var(--b1, #fff); color: #fff; }

  /* ---------- Hi AI 소개 (전시관 안 읽을거리) ----------
     칸마다 --rgb 로 색을 줍니다 (예: --rgb: 94,164,255). 글자는 흰색, 번호·제목 줄·테두리만 그 색으로 물듭니다. */
  .doc { flex: 1; min-height: 0; overflow: auto; padding: 2.4rem 3.4rem 3rem; display: flex; flex-direction: column; gap: 2.6rem; }
  /* 맨 위 — 왼쪽은 소개글, 오른쪽은 작은 소개 영상 (누르면 크게) */
  .doc .hero { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 2.8rem; align-items: center; }
  .intro-video { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 24px; overflow: hidden;
                 background: #000; border: 1px solid var(--line); box-shadow: 0 30px 60px -30px rgba(0,0,0,.8);
                 transition: transform .25s cubic-bezier(.2,.75,.2,1); }
  .intro-video:active { transform: scale(.97); }
  @supports not (aspect-ratio: 1) { .intro-video { height: 19rem; } }
  .intro-video video { display: block; width: 100%; height: 100%; object-fit: cover; background: #000; pointer-events: none; }
  .intro-video .big-play { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem;
                           background: linear-gradient(to top, rgba(5,7,25,.6), rgba(5,7,25,.1) 60%); }
  .intro-video .big-play span { width: 4.6rem; height: 4.6rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                                background: rgba(255,255,255,.92); color: #1766e8; box-shadow: 0 16px 40px -12px rgba(0,0,0,.6); }
  .intro-video .big-play svg { width: 2.3rem; height: 2.3rem; margin-left: .3rem; }
  .intro-video .big-play b { padding: .35rem .95rem; border-radius: 999px; font-size: 1rem; font-weight: 700; color: #fff; background: rgba(0,0,0,.45); }
  .doc h2 { font-size: 3rem; font-weight: 700; letter-spacing: -.03em; }
  .doc h2 .hi { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .doc .kicker { font-family: var(--display); font-size: 1rem; font-weight: 700; letter-spacing: .18em; color: var(--sky); }
  .doc .intro { margin-top: 1rem; display: flex; flex-direction: column; gap: .7rem; }
  .doc .intro p { font-size: 1.42rem; line-height: 1.75; color: var(--ink-2); }
  .doc .intro b { color: #fff; }
  .doc .intro b.c1 { color: #8fc3ff; } .doc .intro b.c2 { color: #ff9fca; } .doc .intro b.c3 { color: #ffd27a; }
  .doc h3 { display: flex; align-items: baseline; flex-wrap: wrap; gap: .4rem .8rem; font-size: 1.75rem; font-weight: 700; letter-spacing: -.02em; margin-bottom: 1rem; }
  .doc h3 small { font-size: 1.15rem; font-weight: 500; letter-spacing: 0; color: var(--ink-2); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  .tile { --rgb: 255,255,255; padding: 1.4rem 1.5rem 1.5rem; border-radius: 22px;
          background: linear-gradient(160deg, rgba(var(--rgb), .22), rgba(var(--rgb), .05) 70%);
          border: 1px solid rgba(var(--rgb), .45); border-top: 4px solid rgb(var(--rgb)); }
  .tile .no { width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
              background: rgb(var(--rgb)); color: #0d1033; }
  .tile .no svg { width: 1.3rem; height: 1.3rem; }
  .tile h4 { margin-top: .9rem; font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .tile h4 small { display: block; margin-top: .2rem; font-family: var(--display); font-size: .95rem; letter-spacing: .06em; color: rgb(var(--rgb)); }
  .tile p { margin-top: .6rem; font-size: 1.2rem; line-height: 1.7; color: rgba(255,255,255,.86); }
  .tiles.one-line .tile p { letter-spacing: -.02em; }   /* 세 가지 지원 원리 — 한 줄에 들어가도록 */
  .tile dl { margin-top: .9rem; display: grid; gap: .3rem; font-size: 1.15rem; line-height: 1.65; }
  .tile dt { margin-top: .35rem; font-size: 1rem; font-weight: 700; color: rgb(var(--rgb)); }
  .tile dd { color: rgba(255,255,255,.86); }
  /* 수업 흐름 — 3단계 */
  .flow { display: grid; grid-template-columns: 1fr 2.4fr 1fr; gap: 1.2rem; align-items: stretch; }
  .flow .tile { position: relative; }
  .flow .tile .head { display: flex; align-items: center; gap: .75rem; }   /* 번호와 제목을 한 줄에 */
  .flow .tile .head h4 { margin-top: 0; }
  .flow .tile:not(:last-child)::after { content: "▶"; position: absolute; right: -1.05rem; top: 50%; transform: translateY(-50%);
    font-size: .85rem; color: rgba(255,255,255,.6); z-index: 1; }
  .steps { margin-top: 1rem; display: flex; align-items: stretch; gap: .5rem; }
  .steps .st { --rgb: 255,255,255; flex: 1; padding: .75rem .85rem .8rem; border-radius: 14px;
               background: rgba(var(--rgb), .14); border-top: 3px solid rgb(var(--rgb)); }
  .steps .deep { flex: 3; display: flex; flex-direction: column; gap: .5rem; padding: .6rem; border-radius: 16px;
                 background: rgba(255,255,255,.05); border: 1px dashed rgba(255,255,255,.3); }
  .steps .deep > b { text-align: center; font-size: 1rem; color: rgba(255,255,255,.75); }
  .steps .deep > div { flex: 1; display: flex; gap: .5rem; }
  .steps strong { display: block; font-size: 1.18rem; font-weight: 700; color: rgb(var(--rgb)); }
  .steps span { display: block; margin-top: .3rem; font-size: 1.02rem; line-height: 1.55; color: rgba(255,255,255,.85); }
  /* ---------- 학년별 산출물 영상 (학년별 사진·영상) ---------- */
  .story { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .grades { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: .5rem; padding: 1.4rem 3.4rem 1.2rem; }
  .grades button { min-height: 3.2rem; padding: 0 1.4rem; border-radius: 999px; font-size: 1.1rem; font-weight: 700;
                   background: rgba(255,255,255,.1); border: 1px solid var(--line); color: var(--ink-2); transition: background .3s, color .3s; }
  .grades button small { margin-left: .35rem; font-size: .85rem; font-weight: 500; opacity: .75; }
  .grades button.on { background: var(--g1); border-color: var(--g1); color: #fff; }
  .gallery { flex: 1; min-height: 0; overflow: auto; padding: .4rem 3.4rem 3rem;
             display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1.2rem; align-content: start; grid-auto-rows: max-content; }
  .gallery .empty { grid-column: 1 / -1; padding: 5rem 0; text-align: center; font-size: 1.3rem; color: var(--ink-2); }
  .gallery button { position: relative; display: block; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,.08);
                    border: 1px solid var(--line); transition: transform .25s cubic-bezier(.2,.75,.2,1); }
  .gallery button:active { transform: scale(.97); }
  /* 학생 산출물 영상 — 맨 앞에 가로 세 칸 × 세로 두 칸 (16:9 에 가까운 직사각형) */
  .gallery button.main { grid-column: span 3; grid-row: span 2; min-height: 22rem; border: 2px solid var(--pink); }
  .gallery button.main img { position: absolute; top: 0; left: 0; height: 100%; aspect-ratio: auto; }
  /* 영상만 있는 학년 — 화면 가운데에 16:9 로 크게 */
  .gallery.solo { display: flex; align-items: center; justify-content: center; }
  .gallery.solo button.main { flex: none; width: 100%; max-width: 72rem; max-height: 100%; min-height: 0; aspect-ratio: 16 / 9; }
  @supports not (aspect-ratio: 1) { .gallery.solo button.main { height: 40.5rem; } }
  .gallery button.main .play { top: 50%; width: 5.6rem; height: 5.6rem; }
  .gallery button.main .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.2rem 1.3rem 1rem; font-size: 1.25rem;
                              background: linear-gradient(to top, rgba(5,7,25,.85), rgba(5,7,25,0)); }
  .gallery img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: rgba(255,255,255,.06); }
  @supports not (aspect-ratio: 1) { .gallery img { height: 13rem; } }   /* 오래된 브라우저 대비 */
  .gallery .cap { display: block; padding: .75rem 1rem .85rem; font-size: 1rem; font-weight: 700; line-height: 1.4; }
  .gallery .play { position: absolute; left: 50%; top: 37.5%; transform: translate(-50%, -50%); width: 4rem; height: 4rem; border-radius: 50%;
                   display: grid; place-items: center; background: rgba(0,0,0,.55); color: #fff; border: 2px solid rgba(255,255,255,.85); }
  .gallery .play svg { width: 2.4rem; height: 2.4rem; }
  /* ---------- 연구학교 최종 보고서 (전자책) ---------- */
  /* 책을 되도록 크게 — 넘기기 단추는 책 양옆, 쪽 번호는 위쪽 막대(.iextra)에 둡니다 */
  .book { flex: 1; min-height: 0; display: flex; align-items: center; gap: 1.2rem; padding: .8rem 1.4rem; }
  .bslot { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
  .iextra { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
  .iextra[hidden] { display: none; }
  .stage { position: relative; flex: none; cursor: pointer; perspective: 2600px; }
  .stage .pg, .leaf .face { background: #fff center / cover no-repeat; overflow: hidden; }
  /* 그림자는 쪽마다 줍니다 — 표지처럼 한 쪽만 있을 때 빈 쪽에 그림자가 생기지 않도록 */
  .stage .pg { position: absolute; top: 0; width: 50%; height: 100%; box-shadow: 0 34px 70px -24px rgba(0,0,0,.75); }
  .stage .pg.left { left: 0; }
  .stage .pg.right { left: 50%; }
  .stage.single .pg.left { display: none; }
  .stage.single .pg.right { left: 0; width: 100%; }
  .stage img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  /* 가운데 접힌 자리의 그늘 */
  .stage .pg::after { content: ""; position: absolute; top: 0; bottom: 0; width: 9%; pointer-events: none; }
  .stage .pg.left::after  { right: 0; background: linear-gradient(to left, rgba(0,0,0,.16), rgba(0,0,0,0)); }
  .stage .pg.right::after { left: 0;  background: linear-gradient(to right, rgba(0,0,0,.16), rgba(0,0,0,0)); }
  .stage.single .pg::after { display: none; }
  /* 넘어가는 종이 한 장 */
  .leaf { position: absolute; top: 0; z-index: 3; width: 50%; height: 100%;
          -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
          transition: transform .7s cubic-bezier(.45,.05,.3,1); }
  .leaf .face { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  .leaf .face.rear { transform: rotateY(180deg); }
  .leaf.fwd  { left: 50%; transform-origin: left center; }
  .leaf.fwd.go  { transform: rotateY(-180deg); }
  .leaf.back { left: 0; transform-origin: right center; }
  .leaf.back.go { transform: rotateY(180deg); }
  .leaf.one  { left: 0; width: 100%; transform-origin: left center; }   /* 세로 화면: 한 쪽씩 */
  .leaf.one .face.rear { display: none; }
  .leaf.one.back    { transform: rotateY(-180deg); }
  .leaf.one.back.go { transform: rotateY(0deg); }

  .book > .bbtn { flex-shrink: 0; }
  .bbtn { display: inline-flex; align-items: center; gap: .45rem; min-height: 3.6rem; padding: 0 1.4rem; border-radius: 999px;
          font-size: 1.05rem; font-weight: 700; background: rgba(255,255,255,.12); border: 1px solid var(--line); }
  .bbtn svg { width: 1.35rem; height: 1.35rem; }
  .bbtn.round { width: 3.9rem; height: 3.9rem; padding: 0; justify-content: center; background: #fff; color: var(--g1); border: 0; }
  .bbtn.next svg { transform: rotate(180deg); }
  .bbtn:disabled { opacity: .3; }
  .bpos { display: flex; align-items: center; gap: 1rem; }
  .bpos strong { min-width: 8.5rem; text-align: center; font-size: 1.25rem; font-weight: 700; white-space: nowrap; }
  .bpos small { font-size: .85em; font-weight: 500; color: var(--ink-3); }
  .bpos input { width: 16rem; accent-color: var(--pink); }

  /* 학생 전시관 — High 5 설명 아래에 학년별 사진·영상 (안쪽 스크롤 없이 화면 전체가 함께 내려갑니다) */
  .shelf h3 { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; margin-bottom: 1rem;
              font-size: 1.85rem; font-weight: 700; letter-spacing: -.02em; }
  .shelf h3 small { font-size: 1.2rem; font-weight: 500; letter-spacing: 0; color: var(--ink-2); }
  .shelf .story { flex: none; }
  .shelf .grades { padding: 0 0 1.2rem; }
  .shelf .gallery { flex: none; overflow: visible; padding: 0; }
  .shelf .gallery.solo button.main { max-width: 62rem; }

  /* 단원 설계 사이트 (교사 전시관) — 왼쪽 설명과 사이트 단추, 오른쪽 활용 영상 */
  .doc .lesson { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 2.8rem; align-items: start; }
  .doc .lesson h2 { font-size: 2.5rem; line-height: 1.25; }
  .doc .lesson .kicker { color: var(--g2); }
  .doc .lesson .intro p { font-size: 1.25rem; }
  .parts { list-style: none; margin-top: 1.3rem; display: flex; flex-wrap: wrap; gap: .5rem; }
  .parts li { display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .9rem .4rem .45rem; border-radius: 999px;
              font-size: 1rem; font-weight: 700; background: rgba(255,255,255,.08); border: 1px solid var(--line); }
  .parts i { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: .8rem;
             background: var(--g1); color: #fff; }
  .sitego { margin-top: 1.8rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; max-width: 30rem;
            padding: .9rem .9rem .9rem 1.6rem; border-radius: 22px; text-decoration: none; color: #fff;
            background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 22px 44px -22px var(--g1); }
  .sitego b { display: block; font-size: 1.35rem; font-weight: 700; }
  .sitego small { display: block; margin-top: .2rem; font-size: 1rem; opacity: .9; }
  .sitego .dot { width: 3.4rem; height: 3.4rem; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--g1); }
  .sitego .dot svg { width: 1.3rem; height: 1.3rem; }
  .lesson-video video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 22px; background: #000;
                        border: 1px solid var(--line); box-shadow: 0 30px 60px -30px rgba(0,0,0,.8); }
  .lesson-video p { margin-top: .8rem; text-align: center; font-size: 1.05rem; font-weight: 700; color: var(--ink-2); }

  /* 크게 보기 */
  #lb { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; display: flex; align-items: center; justify-content: center; gap: 1rem;
        padding: 1.4rem; background: rgba(5,7,25,.94); animation: innerIn .3s ease both; }
  #lb[hidden] { display: none; }
  #lb figure { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
  #lb .media { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #lb img, #lb video { width: 100%; height: 100%; object-fit: contain; }   /* 작은 영상도 화면에 맞게 키웁니다 */
  #lb figcaption { font-size: 1.2rem; font-weight: 700; text-align: center; }
  #lb figcaption small { margin-left: .7rem; font-weight: 500; color: var(--ink-3); }
  #lb .nav { flex-shrink: 0; width: 4.4rem; height: 4.4rem; border-radius: 50%; display: grid; place-items: center;
             background: rgba(255,255,255,.14); color: #fff; }
  #lb .nav svg { width: 1.8rem; height: 1.8rem; }
  #lb .nav.next svg { transform: rotate(180deg); }
  #lb .close { position: absolute; top: 1.2rem; right: 1.2rem; display: inline-flex; align-items: center; gap: .4rem; min-height: 3.4rem; padding: 0 1.4rem;
               border-radius: 999px; font-size: 1.05rem; font-weight: 700; background: #fff; color: var(--paper); z-index: 1; }

  /* ---------- 세로로 세운 스탠바이미 ---------- */
  @media (orientation: portrait) {
    .page { padding: 3rem 2.4rem 2.2rem; gap: 1.8rem; }
    .top { flex-direction: column; align-items: flex-start; gap: 1.4rem; }
    h1 { font-size: 3.5rem; }
    .halls { flex-direction: column; align-items: stretch; gap: 1.1rem; }
    .hall { height: auto; max-height: none; }
    .hall.on { flex-grow: 1.55; }
    .hall .body { padding: 1.7rem 1.8rem; }
    .hall h2 { font-size: 1.95rem; }
    .hall p { margin-top: .6rem; }
    .hall .go { padding-top: 1rem; }
    .hall::before { width: 8rem; height: 8rem; bottom: -2.6rem; }
    .hall::after { width: 5rem; height: 5rem; left: 4.6rem; bottom: .2rem; }
    .hall.on .shot { width: 11rem; }
    .hall .shot .in { width: 10rem; margin: 1rem 1rem 1rem 0; border-radius: 18px; }
    .hint { display: none; }

  setActive(0);
  startAuto();

/* ---------- 펼쳐지는 카드 ---------- */
let activeIndex = 0, autoTimer = null, resumeTimer = null;

function setActive(i) {
  activeIndex = (i + EXHIBIT.halls.length) % EXHIBIT.halls.length;
  document.querySelectorAll('.hall').forEach((el, n) => el.classList.toggle('on', n === activeIndex));
}
function startAuto() {
  clearInterval(autoTimer);
  if (!EXHIBIT.autoSeconds) return;
  autoTimer = setInterval(() => setActive(activeIndex + 1), EXHIBIT.autoSeconds * 1000);
}
function pauseAuto() {                       // 사람이 손댄 뒤에는 잠시 멈춥니다
  clearInterval(autoTimer);
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(startAuto, 12000);
}

/* 마우스는 올리면, 손가락은 닿는 순간 그 카드가 펼쳐집니다 */
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest('.hall');
  if (!el || el.classList.contains('on')) return;
  pauseAuto(); setActive([...el.parentNode.children].indexOf(el));
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.hall');
  if (!el) return;
  pauseAuto(); setActive([...el.parentNode.children].indexOf(el));
});

/* ---------- 전시관 열고 닫기 ---------- */
const inner = document.getElementById('inner');
const ibody = document.getElementById('ibody');

/* 주소 뒤 # 부분으로 화면을 정합니다.  #teacher → 볼거리 고르기,  #teacher/vibe → 그 볼거리 */
function route() {
  const [id, sub] = location.hash.slice(1).split('/');
  if (!document.querySelector('.page')) renderHome();
  const hall = hallById(id);
  if (!hall) return closeInner();
  if (hall.view) return openShelf(hall);
  if (hall.boards) {
    const board = hall.boards.find(b => b.links.some(l => l.id === sub));
    return board ? openBoard(hall, board, board.links.find(l => l.id === sub)) : openPick(hall);
  }
  openInner(hall, {
    body: hall.url ? framed(hall.url) : soon(hall.icon, plain(hall.name)),
    dark: hall.dark,                                   // 영상은 검은 바탕
  });
  if (/youtube/.test(hall.url || '')) setYoutubeVolume(ibody.querySelector('iframe'), hall.volume ?? EXHIBIT.videoVolume);
}
window.addEventListener('hashchange', route);

const framed = url => `
  <div class="loading" id="iloading"><div class="spin"></div>불러오는 중…</div>
  <iframe src="${url}" allow="fullscreen; clipboard-write" allowfullscreen
          onload="setTimeout(()=>document.getElementById('iloading')?.remove(), 1200)"></iframe>`;
const soon = (ic, title) => `
  <div class="soon">
    <div class="glow">${icon(ic)}</div>
    <h2>${title}</h2>
    <p>전시 내용을 준비하고 있습니다.<br>곧 이곳에서 만나 보실 수 있습니다.</p>
  </div>`;

function openInner(hall, { body, dark = false, backLabel = '처음으로', backTo = '', seg = '' }) {
  inner.setAttribute('style', hallVars(hall));
  ibody.classList.toggle('dark', !!dark);
  const back = document.getElementById('iback');
  back.innerHTML = `${icon('back')}${backLabel}`;
  back.onclick = () => { location.hash = backTo; };
  document.getElementById('ien').textContent = hall.en;
  document.getElementById('ititle').textContent = plain(hall.name);
  const segEl = document.getElementById('iseg');
  segEl.innerHTML = seg;
  segEl.hidden = !seg;
  const extra = document.getElementById('iextra');
  extra.innerHTML = ''; extra.hidden = true;
  ibody.innerHTML = body;
  if (typeof closeShot === 'function') closeShot();
  inner.hidden = false;
  clearInterval(autoTimer);
}

const high5Html = hall => hall.high5 ? `
  <section class="high5 rise">
    <h3>${hall.high5.title}<small>${hall.high5.intro}</small></h3>
    <ol>${hall.high5.items.map((it, n) => `<li><b><i>${n + 1}</i>${it.name}</b><span>${it.desc}</span></li>`).join('')}</ol>
  </section>` : '';

/* 고르는 화면 없이 High 5 설명 바로 아래에 볼거리 하나를 펼쳐 두는 화면 (학생 전시관) */
function openShelf(hall) {
  openInner(hall, { body: `
    <div class="pick">
      ${high5Html(hall)}
      <section class="shelf rise" style="--i:1">
        <h3>${hall.viewTitle}<small>${hall.viewNote}</small></h3>
        ${VIEWS[hall.view]()}
      </section>
    </div>` });
}

/* 볼거리 고르기 화면 */
function openPick(hall) {
  const card = (b, i) => {
    const one = b.links.length === 1;
    const attrs = `class="board rise${one ? '' : ' multi'}" style="--b1:${b.colors[0]};--b2:${b.colors[1]};--i:${i + 1}"`;
    const inside = `
      <span class="badge">${icon(b.icon)}</span>
      <span class="tag">${b.tag}</span>
      <h3>${b.name}</h3>
      ${b.by ? `<div class="by">${icon('user')}${b.by}</div>` : ''}
      <p class="what">${b.what}</p>
      ${b.chips ? `<div class="chips">${b.chips.map(c => `<span>${c}</span>`).join('')}</div>` : ''}
      ${one
        ? `<div class="go"><span>${b.links[0].newTab ? '새 창으로 열기' : '보러 가기'}</span><span class="dot">${icon(b.links[0].newTab ? 'arrow' : 'open')}</span></div>`
        : `<div class="links">${b.links.map(l => `
            <button data-board="${hall.id}/${l.id}"><span>${l.label}</span><span class="dot">${icon('open')}</span></button>`).join('')}
          </div>`}`;
    return one
      ? `<button ${attrs} data-board="${hall.id}/${b.links[0].id}">${inside}</button>`
      : `<div ${attrs}>${inside}</div>`;
  };
  openInner(hall, { body: `
    <div class="pick">
      ${high5Html(hall)}
      ${hall.high5 ? '' : `<div class="pick-head rise"><p class="lead">${hall.lead || ''}</p></div>`}
      <div class="boards" style="--n:${hall.boards.length}">${hall.boards.map(card).join('')}</div>
    </div>` });
}

/* 볼거리 하나를 연 화면 — 위쪽 단추로 다른 볼거리로 바로 넘어갑니다 */
function openBoard(hall, board, link) {
  openInner(hall, {
    body: link.view ? VIEWS[link.view]() : link.url ? framed(link.url) : soon(board.icon, link.label),
    backLabel: '목록으로', backTo: hall.id,
    seg: hall.boards.flatMap(b => b.links.map(l => `
      <button class="${l.id === link.id ? 'on' : ''}" style="--b1:${b.colors[0]}" data-board="${hall.id}/${l.id}">${l.label}</button>`)).join(''),
  });
  if (link.view === 'book') startBook();
  const lv = ibody.querySelector('.lesson-video video');
  if (lv) {                                    // 단원 설계 활용 영상은 들어가면 바로 재생됩니다
    lv.volume = LESSON.video.volume / 100;
    // 브라우저가 소리 있는 자동 재생을 막으면 소리를 끈 채로라도 재생합니다
    lv.play().catch(() => { lv.muted = true; lv.play().catch(() => {}); });
  }
}

/* 유튜브 영상 소리 크기 — 플레이어가 준비되는 시간이 들쭉날쭉해서 몇 번 나눠 보냅니다 */
function setYoutubeVolume(frame, volume) {
  if (!frame) return;
  const send = () => frame.contentWindow?.postMessage(JSON.stringify(
    { event: 'command', func: 'setVolume', args: [volume] }), '*');
  frame.addEventListener('load', () => [300, 1000, 2500, 5000].forEach(t => setTimeout(send, t)));
}

/* Hi AI 소개 영상 — 소개글 옆에서 소리 없이 작게 돌다가, 누르면 화면 가득 커지며 소리와 함께 처음부터 재생됩니다 */
function openHiaiVideo() {
  const small = document.querySelector('#hiaiVideo video');
  if (small) small.pause();
  lb.innerHTML = `
    <button class="close press" data-lb="close">${icon('back')}닫기</button>
    <figure><div class="media"><video src="${HIAI.video.src}" poster="${HIAI.video.poster}" controls autoplay playsinline></video></div></figure>`;
  lb.querySelector('video').volume = HIAI.video.volume / 100;
  lb.hidden = false;
}
document.addEventListener('click', e => { if (e.target.closest('#hiaiVideo')) openHiaiVideo(); });

/* ---------- 전시관 안 읽을거리 · 사진첩 ---------- */
const VIEWS = {
  hiai() {
    const H = HIAI, R = H.run;
    const c = x => `style="--rgb:${x.rgb}"`;
    const step = x => `<div class="st" ${c(x)}><strong>${x.name}</strong><span>${x.desc}</span></div>`;
    return `
    <div class="doc">
      <section class="rise hero">
        <div><p class="kicker">HI AI</p><h2><span class="hi">Hi AI</span>란?</h2>
          <div class="intro">${H.intro.map(t => `<p>${t}</p>`).join('')}</div></div>
        ${H.video ? `
        <button class="intro-video" id="hiaiVideo" aria-label="소개 영상 크게 보기">
          <video src="${H.video.src}" poster="${H.video.poster}" muted loop autoplay playsinline preload="auto"></video>
          <span class="big-play"><span>${icon('tri')}</span><b>눌러서 크게 보기</b></span>
        </button>` : ''}
      </section>
      <section class="rise" style="--i:1"><h3>세 가지 지원 원리</h3>
        <div class="tiles one-line">${H.principles.map(x => `
          <div class="tile" ${c(x)}><span class="no">${icon(x.icon)}</span><h4>${x.name}<small>${x.en}</small></h4><p>${x.desc}</p></div>`).join('')}
        </div></section>
      <section class="rise" style="--i:2"><h3>수업의 흐름</h3>
        <div class="flow">
          <div class="tile" ${c(H.design)}><div class="head"><span class="no">1</span><h4>${H.design.name}</h4></div><p>${H.design.desc}</p></div>
          <div class="tile" ${c(R)}><div class="head"><span class="no">2</span><h4>${R.name}</h4></div>
            <div class="steps">${step(R.first)}
              <div class="deep"><b>깊이 탐구하기</b><div>${R.deep.map(step).join('')}</div></div>
              ${step(R.last)}</div></div>
          <div class="tile" ${c(H.review)}><div class="head"><span class="no">3</span><h4>${H.review.name}</h4></div><p>${H.review.desc}</p></div>
        </div></section>
      <section class="rise" style="--i:3"><h3>학습 도달점에 따른 AI 학습 지원 유형</h3>
        <div class="tiles">${H.types.map((x, n) => `
          <div class="tile" ${c(x)}><span class="no">${n + 1}</span><h4>${x.name}<small>${x.tools}</small></h4>
            <dl><dt>지원</dt><dd>${x.support}</dd><dt>학습 도달점</dt><dd>${x.goal}</dd></dl></div>`).join('')}
        </div></section>
    </div>`;
  },
  story() {
    storyGrade = storyGrade || STORY[0].key;
    return `
    <div class="story">
      <div class="grades">${STORY.map(g => `
        <button class="${g.key === storyGrade ? 'on' : ''}" data-grade="${g.key}">${g.label}</button>`).join('')}
      </div>
      <div class="gallery${soloGrade() ? ' solo' : ''}" id="gallery">${galleryHtml()}</div>
    </div>`;
  },
  lesson() {
    const L = LESSON;
    return `
    <div class="doc">
      <section class="rise lesson">
        <div>
          <p class="kicker">UNIT DESIGN</p><h2>${L.title}</h2>
          <div class="intro">${L.intro.map(t => `<p>${t}</p>`).join('')}</div>
          <ol class="parts">${L.parts.map((x, n) => `<li><i>${n + 1}</i>${x}</li>`).join('')}</ol>
          <a class="sitego press" href="${L.url}" target="_blank" rel="noopener">
            <span><b>단원 설계 사이트 열기</b><small>${L.url.replace(/^https?:\/\//, '')}</small></span>
            <span class="dot">${icon('arrow')}</span></a>
        </div>
        <div class="lesson-video">
          <video src="${L.video.src}" poster="${L.video.poster}" controls playsinline preload="metadata"></video>
          <p>단원 설계 사이트 활용 영상</p>
        </div>
      </section>
    </div>`;
  },
  book() {
    return `
    <div class="book" id="book">
      <button class="bbtn round press" data-bk="prev" aria-label="앞쪽">${icon('back')}</button>
      <div class="bslot" id="bslot">
        <div class="stage" id="stage">
          <div class="pg left" id="pgL"><img alt=""></div>
          <div class="pg right" id="pgR"><img alt=""></div>
        </div>
      </div>
      <button class="bbtn round next press" data-bk="next" aria-label="다음 쪽">${icon('back')}</button>
    </div>`;
  },
};

/* ---------- 전자책 ----------
   가로 화면에서는 두 쪽을 펼쳐 보이고(표지는 오른쪽에 한 쪽만), 세로 화면에서는 한 쪽씩 보입니다.
   책 오른쪽을 누르거나 왼쪽으로 밀면 다음 쪽, 왼쪽을 누르거나 오른쪽으로 밀면 앞쪽으로 넘어갑니다. */
let bookAt = 1, bookBusy = false;
const bookSpread = () => innerWidth > innerHeight;
const pageSrc = (n, small) => `${REPORT.dir}/${small ? 'thumb/' : ''}${String(n).padStart(2, '0')}.jpg`;
/* 지금 펼친 쪽 [왼쪽, 오른쪽] — 없는 쪽은 0 */
function bookPair(at) {
  if (!bookSpread()) return [0, at];
  const l = at - (at % 2);                      // 짝수 쪽이 왼쪽, 홀수 쪽이 오른쪽
  return [l, l + 1 > REPORT.pages ? 0 : l + 1];
}
function setPage(el, n) {
  el.style.visibility = n ? '' : 'hidden';
  if (!n) return;
  el.style.backgroundImage = `url("${pageSrc(n, true)}")`;   // 큰 그림이 뜨기 전 작은 그림
  el.querySelector('img').src = pageSrc(n);
}
/* 쪽 번호·표지 단추는 책을 크게 보이도록 위쪽 막대에 둡니다 */
function startBook() {
  bookAt = 1; bookBusy = false; bookWasSpread = bookSpread();
  const extra = document.getElementById('iextra');
  extra.innerHTML = `
    <button class="bbtn press" data-bk="first">${icon('first')}<span>표지</span></button>
    <div class="bpos"><strong id="bnum"></strong><input type="range" id="bslide" min="1" max="${REPORT.pages}" value="1"></div>`;
  extra.hidden = false;
  sizeBook(); drawBook();
}
function sizeBook() {
  const wrap = document.getElementById('bslot'), stage = document.getElementById('stage');
  if (!wrap) return;
  const cols = bookSpread() ? 2 : 1;
  const h = Math.min(wrap.clientHeight, wrap.clientWidth / (cols * REPORT.ratio));
  stage.style.width = Math.floor(h * REPORT.ratio) * cols + 'px';
  stage.style.height = Math.floor(h) + 'px';
  stage.classList.toggle('single', cols === 1);
}
function drawBook() {
  const [l, r] = bookPair(bookAt);
  setPage(document.getElementById('pgL'), l);
  setPage(document.getElementById('pgR'), r);
  document.getElementById('bnum').innerHTML = `${l && r ? `${l}–${r}` : l || r}<small> / ${REPORT.pages}쪽</small>`;
  document.getElementById('bslide').value = bookAt;
  document.querySelector('[data-bk="prev"]').disabled = bookSpread() ? !l : bookAt <= 1;
  document.querySelector('[data-bk="next"]').disabled = Math.max(l, r) >= REPORT.pages;
  // 다음·앞쪽 그림을 미리 불러 둡니다
  [-2, -1, 1, 2, 3].forEach(d => { const n = Math.max(l, r) + d; if (n >= 1 && n <= REPORT.pages) new Image().src = pageSrc(n); });
}
/* 한 장 넘기기 — 넘어가는 종이(leaf) 앞면은 지금 쪽, 뒷면은 넘긴 뒤 보일 쪽입니다 */
function flipBook(dir) {
  if (bookBusy) return;
  const spread = bookSpread(), [l, r] = bookPair(bookAt);
  const target = spread ? (dir > 0 ? (l || 0) + 2 : l - 1) : bookAt + dir;
  if (target < 1 || target > REPORT.pages || (spread && dir > 0 && !r)) return;
  const [nl, nr] = bookPair(target);
  const stage = document.getElementById('stage');
  const leaf = document.createElement('div');
  leaf.className = `leaf ${dir > 0 ? 'fwd' : 'back'}${spread ? '' : ' one'}`;
  const face = (n, cls) => `<div class="face ${cls}"${n ? ` style="background-image:url('${pageSrc(n, true)}')"` : ''}>${n ? `<img src="${pageSrc(n)}" alt="">` : ''}</div>`;
  if (spread) {
    leaf.innerHTML = dir > 0 ? face(r, 'front') + face(nl, 'rear') : face(l, 'front') + face(nr, 'rear');
    setPage(document.getElementById(dir > 0 ? 'pgR' : 'pgL'), dir > 0 ? nr : nl);   // 종이 밑에 깔릴 쪽
  } else {
    leaf.innerHTML = face(dir > 0 ? r : nr, 'front') + face(0, 'rear');
    if (dir > 0) setPage(document.getElementById('pgR'), nr);
  }
  bookBusy = true;
  stage.appendChild(leaf);
  leaf.getBoundingClientRect();                       // 시작 모습을 먼저 그린 뒤
  requestAnimationFrame(() => leaf.classList.add('go'));
  setTimeout(() => { bookAt = target; drawBook(); leaf.remove(); bookBusy = false; }, 720);
}
function jumpBook(n) { if (!bookBusy) { bookAt = n; drawBook(); } }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-bk]');
  if (b) {
    const k = b.dataset.bk;
    if (k === 'first') jumpBook(1); else flipBook(k === 'next' ? 1 : -1);
    return;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'bslide') jumpBook(+e.target.value); });
/* 책을 누르거나 손가락으로 밀어서 넘기기 */
let bookDown = null;
document.addEventListener('pointerdown', e => { if (e.target.closest('#stage')) bookDown = { x: e.clientX, y: e.clientY }; });
document.addEventListener('pointerup', e => {
  const stage = document.getElementById('stage');
  if (!bookDown || !stage) return;
  const dx = e.clientX - bookDown.x, dy = e.clientY - bookDown.y;
  bookDown = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) return flipBook(dx < 0 ? 1 : -1);
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
    const r = stage.getBoundingClientRect();
    flipBook(e.clientX > r.left + r.width / 2 ? 1 : -1);
  }
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('book') || !lb.hidden) return;
  if (e.key === 'ArrowRight') flipBook(1);
  if (e.key === 'ArrowLeft') flipBook(-1);
});
let bookWasSpread = null;
window.addEventListener('resize', () => {
  if (!document.getElementById('book')) return;
  sizeBook();
  if (bookWasSpread !== bookSpread()) drawBook();
  bookWasSpread = bookSpread();
});

let storyGrade = '';
const gradeOf = key => STORY.find(g => g.key === key);
const storySrc = (g, it, small) => `files/story/${g.key}/${small ? 'thumb/' : ''}${it[0]}.${small || it[1] === 'p' ? 'jpg' : 'mp4'}`;
/* 산출물 영상만 있는 학년 — 영상 하나를 가운데 크게 보여 줍니다 */
const soloGrade = () => { const g = gradeOf(storyGrade); return g.items.length > 0 && g.items.every(it => it[1] === 'm'); };
function galleryHtml() {
  const g = gradeOf(storyGrade);
  if (!g.items.length) return `<p class="empty">${g.label} 사진과 영상을 준비하고 있습니다.</p>`;
  return g.items.map((it, i) => `
    <button data-shot="${i}"${it[1] === 'm' ? ' class="main"' : ''}>
      <img src="${storySrc(g, it, true)}" alt="" loading="lazy">
      ${it[1] !== 'p' ? `<span class="play">${icon('tri')}</span>` : ''}
      <span class="cap">${it[2]}</span>
    </button>`).join('');
}

/* 사진·영상 크게 보기 */
const lb = document.getElementById('lb');
let lbIndex = 0;
function openShot(i) {
  const g = gradeOf(storyGrade);
  lbIndex = (i + g.items.length) % g.items.length;
  const it = g.items[lbIndex];
  lb.innerHTML = `
    <button class="close press" data-lb="close">${icon('back')}닫기</button>
    <button class="nav prev press" data-lb="prev" aria-label="이전">${icon('back')}</button>
    <figure>
      <div class="media">${it[1] !== 'p'
        ? `<video src="${storySrc(g, it)}" poster="${storySrc(g, it, true)}" controls autoplay playsinline></video>`
        : `<img src="${storySrc(g, it)}" alt="">`}</div>
      <figcaption>${g.label} · ${it[2]}<small>${lbIndex + 1} / ${g.items.length}</small></figcaption>
    </figure>
    <button class="nav next press" data-lb="next" aria-label="다음">${icon('back')}</button>`;
  const v = lb.querySelector('video');
  if (v) v.volume = EXHIBIT.videoVolume / 100;
  lb.hidden = false;
}
function closeShot() {
  lb.hidden = true; lb.innerHTML = '';
  const small = document.querySelector('#hiaiVideo video');   // 크게 본 Hi AI 영상을 닫으면 작은 영상이 다시 돕니다
  if (small) small.play().catch(() => {});
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-grade],[data-shot],[data-lb]');
  if (!t) return;
  if (t.dataset.grade) {
    storyGrade = t.dataset.grade;
    document.querySelectorAll('[data-grade]').forEach(b => b.classList.toggle('on', b === t));
    const gal = document.getElementById('gallery');
    gal.innerHTML = galleryHtml(); gal.scrollTop = 0;
    gal.classList.toggle('solo', soloGrade());
  } else if (t.dataset.shot) openShot(+t.dataset.shot);
  else if (t.dataset.lb === 'close') closeShot();
  else openShot(lbIndex + (t.dataset.lb === 'next' ? 1 : -1));
});
document.addEventListener('keydown', e => {
  if (lb.hidden) return;
  if (e.key === 'Escape') closeShot();
  if (!lb.querySelector('.nav')) return;          // 앞뒤로 넘길 것이 없는 화면 (Hi AI 영상)
  if (e.key === 'ArrowRight') openShot(lbIndex + 1);
  if (e.key === 'ArrowLeft') openShot(lbIndex - 1);
});

function closeInner() {
  if (inner.hidden) return;
  inner.classList.add('leaving');
  setTimeout(() => {
    inner.classList.remove('leaving');
    inner.hidden = true;
    ibody.innerHTML = '';
    closeShot();
    startAuto();
  }, 320);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-board]');
  if (b) {
    const [hid, lid] = b.dataset.board.split('/');
    const link = (hallById(hid)?.boards || []).flatMap(x => x.links).find(l => l.id === lid);
    if (link && link.newTab && link.url) window.open(link.url, '_blank', 'noopener');   // 새 창으로 여는 볼거리
    else location.hash = b.dataset.board;
    return;
  }
  const t = e.target.closest('[data-go]');
  if (!t) return;
  const hall = hallById(t.dataset.go);
  if (hall && hall.link) return window.open(hall.link, '_blank', 'noopener');   // 새 창으로 여는 전시관
  if (hall) return revealInto(t, hall);
});

/* 누른 카드가 둥글게 번지며 화면을 덮은 뒤 전시관으로 들어갑니다 */
function revealInto(el, hall) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const size = Math.min(r.width, r.height);
  const far = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
  const d = document.createElement('div');
  d.className = 'reveal';
  d.setAttribute('style', `${hallVars(hall)};left:${cx}px;top:${cy}px;width:${size}px;height:${size}px`);
  document.body.appendChild(d);
  requestAnimationFrame(() => {
    d.style.transform = `translate(-50%, -50%) scale(${(far * 2.1) / size})`;
  });
  setTimeout(() => {
    location.hash = hall.id;
    requestAnimationFrame(() => { d.style.opacity = '0'; });
    setTimeout(() => d.remove(), 500);
  }, 430);
}
document.addEventListener('contextmenu', e => e.preventDefault());

/* 스탠바이미 점검 — 주소 뒤에 ?check 를 붙이면 왼쪽 아래에 브라우저 정보가 나옵니다 (사진 찍어 보내 주세요) */
if (/[?&]check\b/.test(location.search)) {
  const box = document.createElement('pre');
  box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;max-width:70vw;margin:0;padding:10px 12px;border-radius:10px;'
    + 'background:rgba(0,0,0,.82);color:#fff;font:14px/1.5 monospace;white-space:pre-wrap;pointer-events:none';
  document.body.appendChild(box);
  const sup = q => (window.CSS && CSS.supports(q)) ? 'O' : 'X';
  const tick = () => {
    const on = document.querySelector('.hall.on .shot .in');
    const r = on && on.getBoundingClientRect();
    box.textContent = [
      navigator.userAgent,
      '화면 ' + innerWidth + '×' + innerHeight + ' · 배율 ' + devicePixelRatio + ' · 기본 글자 ' + getComputedStyle(document.documentElement).fontSize,
      '그림칸 ' + (r ? Math.round(r.width) + '×' + Math.round(r.height) + 'px' : '없음'),
      'inset ' + sup('inset: 0') + ' · aspect-ratio ' + sup('aspect-ratio: 1') + ' · flex gap ' + sup('gap: 1px') + ' · clamp ' + sup('width: clamp(1px, 2px, 3px)'),
    ].join('\n');
  };
  setInterval(tick, 1000); tick();
}

/* 글꼴을 기다리되, 글꼴 서버가 느려도 2.5초 뒤에는 화면을 그립니다 */
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 2500))]).then(route);
</script>
